cpus_per_task: 16
eval_name: video_classification_frozen
folder: ./runs/vjepa2_router
mem_per_gpu: 220G
nodes: 8
num_workers: 8
resume_checkpoint: true
tag: router
tasks_per_node: 8
experiment:
  classifier:
    num_heads: 16
    num_probe_blocks: 4
  data:
    color_jitter: true
    dataset_type: VideoDataset
    dataset_train: ./data/train.csv
    dataset_val: ./data/val.csv
    frame_step: 2
    frames_per_clip: 16
    num_classes: 2
    num_segments: 6
    num_views_per_segment: 3
    resolution: 256
  optimization:
    batch_size: 4
    # Non-target probability diversity applies to num_classes >= 3; keep 0.0 for binary classification
    diversity_weight: 0.0
    focal_gamma: 2.0
    use_difficulty_weighting: true
    multihead_kwargs:
